services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drex
      POSTGRES_PASSWORD: drex123
      POSTGRES_DB: drexdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drex -d drexdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build: .
    command: python -m app.db.seed
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
